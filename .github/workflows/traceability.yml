name: Traceability

# Manual only (2026-09-28): the account's private-repository Actions budget is exhausted, so push and
# pull_request runs could not start and each one sent a failure email. Run on demand with
#   gh workflow run traceability.yml -R mysticalsin/Metis-2.0-Program
# Restore push/pull_request triggers once the owner raises the Actions budget (ledger M2-0011 note).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check generated traceability
        run: node docs/metis-2.0/tools/trace/build-traceability.mjs --check

      - name: Test traceability generator
        run: node --test docs/metis-2.0/tools/trace/build-traceability.test.mjs
