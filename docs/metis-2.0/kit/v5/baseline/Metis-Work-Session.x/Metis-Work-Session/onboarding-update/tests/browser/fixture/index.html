<!doctype html><html lang="en"><meta charset="utf-8"><title>Métis source interaction fixture</title>
<link rel="stylesheet" href="utilities.css"><style>
:root{--color-ink:#f6f3ff;--color-ink-2:#c8c1d5;--color-accent:#b8a0ff;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:#171221;color:var(--color-ink);font:14px system-ui}
#app{height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:auto;padding:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.onboard-cta{background:#383040;border:1px solid #857597;border-radius:12px;min-height:40px;padding:8px 14px}
.focus-ring:focus-visible{outline:3px solid #d8c4ff;outline-offset:2px}
.preview-box{min-height:260px;padding:24px;background:#231d30;border:1px solid #554965;border-radius:14px;width:100%;overflow-wrap:anywhere}
.demo-chips{display:flex;gap:10px;flex-wrap:wrap;padding:8px 0}.demo-chips button{background:#30283d;border:1px solid #6b5a83;border-radius:10px;padding:9px}
pre{white-space:pre-wrap;overflow-wrap:anywhere} .demo-cursor{position:absolute;top:0;left:0;pointer-events:none;width:14px;height:14px;background:white;border-radius:50%}
</style><div id="app"></div><script src="react-local.js"></script><script src="demo-app.js"></script></html>
