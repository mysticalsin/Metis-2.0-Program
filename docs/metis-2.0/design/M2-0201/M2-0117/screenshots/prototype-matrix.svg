<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">M2-0117 designed prototype screenshot matrix</title>
  <desc id="desc">Four-destination Settings with search, local model states, save failure, policy change and reduced motion.</desc>
  <style>text{font-family:Inter,Arial,sans-serif}.h{font-size:24px;font-weight:700}.s{font-size:15px}.m{font-size:13px}.card{rx:8}</style>
  <rect width="1200" height="760" fill="#f7f5f0"/><text x="32" y="44" class="h" fill="#1c1d20">M2-0117 four-destination Settings</text>
  <g transform="translate(32 78)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Light 1x: destinations</text><rect x="26" y="58" width="104" height="138" rx="8" fill="#eef2f7"/><text x="42" y="86" class="m">General</text><text x="42" y="114" class="m">Voice</text><text x="42" y="142" class="m">Knowledge</text><text x="42" y="170" class="m">Privacy</text><rect x="150" y="58" width="170" height="58" rx="8" fill="#f8fafc" stroke="#d6dce6"/><text x="166" y="92" class="m">Readiness summary</text></g>
  <g transform="translate(424 78)"><rect class="card" width="350" height="230" fill="#111317" stroke="#3b414a"/><text x="20" y="34" class="s" fill="#f4f2ec">Dark 1x: local packs</text><rect x="34" y="62" width="282" height="120" rx="8" fill="#171b22" stroke="#3d4654"/><text x="52" y="91" class="m" fill="#f4f2ec">Parakeet: installed, not selected</text><text x="52" y="121" class="m" fill="#f4f2ec">Whisper: downloading 38%</text><text x="52" y="151" class="m" fill="#bfc7d5">Install never selects silently.</text></g>
  <g transform="translate(816 78)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Light 2x: search and save</text><rect x="34" y="62" width="282" height="32" rx="6" fill="#f4f6fa" stroke="#c6ccd6"/><text x="50" y="84" class="m">Search: mic</text><rect x="34" y="118" width="282" height="54" rx="8" fill="#fff1f1" stroke="#c65b5b"/><text x="50" y="150" class="m">Save failed; confirmed value kept.</text></g>
  <g transform="translate(228 348)"><rect class="card" width="350" height="230" fill="#111317" stroke="#3b414a"/><text x="20" y="34" class="s" fill="#f4f2ec">Dark 2x: policy changed</text><rect x="34" y="64" width="282" height="94" rx="8" fill="#2b2415" stroke="#d2a33d"/><text x="52" y="94" class="m" fill="#ffe7aa">Next session: Cloudflare</text><text x="52" y="124" class="m" fill="#ffe7aa">Current meeting unchanged.</text></g>
  <g transform="translate(620 348)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Reduced motion</text><rect x="42" y="76" width="266" height="94" rx="8" fill="#f5f6f8" stroke="#c6ccd6"/><text x="60" y="110" class="m">Disclosure opens instantly.</text><text x="60" y="140" class="m">Feedback uses text and icons.</text></g>
</svg>

