<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">M2-0094 designed prototype screenshot matrix</title>
  <desc id="desc">Unified task card states across light and dark, 1x and 2x, with reduced motion.</desc>
  <style>text{font-family:Inter,Arial,sans-serif}.h{font-size:24px;font-weight:700}.s{font-size:15px}.m{font-size:13px}.card{rx:8}.line{stroke-width:2}</style>
  <rect width="1200" height="760" fill="#f7f5f0"/>
  <text x="32" y="44" class="h" fill="#1c1d20">M2-0094 receipt-driven task card</text>
  <g transform="translate(32 78)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Light 1x: queued</text><rect x="34" y="62" width="282" height="118" rx="8" fill="#f5f6f8" stroke="#c6ccd6"/><text x="52" y="91" class="m">Receipt R-1842</text><text x="52" y="119" class="m">Prepare follow-up email</text><text x="52" y="151" class="m" fill="#626873">3 receipt steps pending</text></g>
  <g transform="translate(424 78)"><rect class="card" width="350" height="230" fill="#111317" stroke="#3b414a"/><text x="20" y="34" class="s" fill="#f4f2ec">Dark 1x: running</text><rect x="34" y="62" width="282" height="118" rx="8" fill="#171b22" stroke="#3d4654"/><text x="52" y="91" class="m" fill="#f4f2ec">Step 2 of 4 from receipt</text><rect x="52" y="116" width="226" height="8" rx="4" fill="#313946"/><rect x="52" y="116" width="112" height="8" rx="4" fill="#8fb6ff"/><text x="52" y="151" class="m" fill="#bfc7d5">Status query shows this card.</text></g>
  <g transform="translate(816 78)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Light 2x: partial</text><rect x="34" y="62" width="282" height="128" rx="8" fill="#f5f6f8" stroke="#c6ccd6"/><text x="52" y="91" class="m">Done: draft created</text><text x="52" y="119" class="m">Blocked: calendar permission</text><text x="52" y="151" class="m">Actions: retry, undo, keep partial</text></g>
  <g transform="translate(228 348)"><rect class="card" width="350" height="230" fill="#111317" stroke="#3b414a"/><text x="20" y="34" class="s" fill="#f4f2ec">Dark 2x: quiet call mode</text><rect x="34" y="72" width="282" height="92" rx="8" fill="#171b22" stroke="#3d4654"/><text x="52" y="103" class="m" fill="#f4f2ec">Typed reply ready</text><text x="52" y="132" class="m" fill="#bfc7d5">No TTS. Low motion.</text></g>
  <g transform="translate(620 348)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Reduced motion</text><rect x="34" y="70" width="282" height="106" rx="8" fill="#f5f6f8" stroke="#c6ccd6"/><text x="52" y="103" class="m">Step changes update instantly.</text><text x="52" y="132" class="m">No progress sweep animation.</text></g>
</svg>

