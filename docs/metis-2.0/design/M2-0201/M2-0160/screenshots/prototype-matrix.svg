<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">M2-0160 designed prototype screenshot matrix</title>
  <desc id="desc">Onboarding repair flows, privacy-ready Cloudflare setup, optional downloads and welcome slot variants.</desc>
  <style>text{font-family:Inter,Arial,sans-serif}.h{font-size:24px;font-weight:700}.s{font-size:15px}.m{font-size:13px}.card{rx:8}</style>
  <rect width="1200" height="760" fill="#f7f5f0"/><text x="32" y="44" class="h" fill="#1c1d20">M2-0160 onboarding repair flows</text>
  <g transform="translate(32 78)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Light 1x: fresh setup</text><rect x="36" y="60" width="278" height="118" rx="10" fill="#eef2f7"/><text x="58" y="92" class="m">Existing scene order retained</text><text x="58" y="124" class="m">Cloudflare privacy route shown</text><text x="58" y="154" class="m">No silent defaults</text></g>
  <g transform="translate(424 78)"><rect class="card" width="350" height="230" fill="#111317" stroke="#3b414a"/><text x="20" y="34" class="s" fill="#f4f2ec">Dark 1x: optional downloads</text><rect x="34" y="62" width="282" height="118" rx="8" fill="#171b22" stroke="#3d4654"/><text x="52" y="94" class="m" fill="#f4f2ec">Parakeet: resume later</text><text x="52" y="124" class="m" fill="#f4f2ec">Local model: optional</text><text x="52" y="154" class="m" fill="#bfc7d5">Setup continues while pending.</text></g>
  <g transform="translate(816 78)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Light 2x: migration repair</text><rect x="34" y="62" width="282" height="118" rx="8" fill="#f4f6fa" stroke="#c6ccd6"/><text x="52" y="92" class="m">Notes preserved</text><text x="52" y="122" class="m">Keys preserved</text><text x="52" y="152" class="m">Legacy IDs mapped explicitly</text></g>
  <g transform="translate(228 348)"><rect class="card" width="350" height="230" fill="#111317" stroke="#3b414a"/><text x="20" y="34" class="s" fill="#f4f2ec">Dark 2x: welcome slot</text><rect x="48" y="66" width="254" height="116" rx="8" fill="#171b22" stroke="#3d4654"/><text x="68" y="100" class="m" fill="#f4f2ec">Text-led Tony welcome</text><text x="68" y="132" class="m" fill="#bfc7d5">Recording: NOT_PROVIDED</text></g>
  <g transform="translate(620 348)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Reduced motion</text><rect x="42" y="76" width="266" height="92" rx="8" fill="#f5f6f8" stroke="#c6ccd6"/><text x="60" y="110" class="m">No parallax or scene drift.</text><text x="60" y="140" class="m">Copy explains each transition.</text></g>
</svg>
