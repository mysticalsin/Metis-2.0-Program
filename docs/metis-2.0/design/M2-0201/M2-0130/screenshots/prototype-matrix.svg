<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">M2-0130 designed prototype screenshot matrix</title>
  <desc id="desc">Evidence-first Intelligence workspace across visual variants.</desc>
  <style>text{font-family:Inter,Arial,sans-serif}.h{font-size:24px;font-weight:700}.s{font-size:15px}.m{font-size:13px}.card{rx:8}</style>
  <rect width="1200" height="760" fill="#f7f5f0"/><text x="32" y="44" class="h" fill="#1c1d20">M2-0130 evidence-first Intelligence</text>
  <g transform="translate(32 78)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Light 1x: briefings</text><rect x="30" y="58" width="290" height="50" rx="8" fill="#eef2f7"/><text x="48" y="89" class="m">Briefing with evidence count</text><rect x="30" y="128" width="132" height="48" rx="8" fill="#f8fafc" stroke="#d6dce6"/><rect x="188" y="128" width="132" height="48" rx="8" fill="#f8fafc" stroke="#d6dce6"/></g>
  <g transform="translate(424 78)"><rect class="card" width="350" height="230" fill="#111317" stroke="#3b414a"/><text x="20" y="34" class="s" fill="#f4f2ec">Dark 1x: review inbox</text><rect x="34" y="62" width="282" height="122" rx="8" fill="#171b22" stroke="#3d4654"/><text x="52" y="94" class="m" fill="#f4f2ec">Conflict: account owner</text><text x="52" y="124" class="m" fill="#f4f2ec">Stale source: 18 days</text><text x="52" y="154" class="m" fill="#bfc7d5">Approve or dismiss; no auto fact.</text></g>
