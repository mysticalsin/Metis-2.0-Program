<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">M2-0137 designed prototype screenshot matrix</title>
  <desc id="desc">Memory approve, forget, isolation and outage state variants.</desc>
  <style>text{font-family:Inter,Arial,sans-serif}.h{font-size:24px;font-weight:700}.s{font-size:15px}.m{font-size:13px}.card{rx:8}</style>
  <rect width="1200" height="760" fill="#f7f5f0"/><text x="32" y="44" class="h" fill="#1c1d20">M2-0137 governed memory UX</text>
  <g transform="translate(32 78)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Light 1x: review</text><rect x="34" y="62" width="282" height="106" rx="8" fill="#f4f6fa" stroke="#c6ccd6"/><text x="52" y="92" class="m">Pending memory from meeting</text><text x="52" y="122" class="m">Approve / Forget / Local only</text></g>
  <g transform="translate(424 78)"><rect class="card" width="350" height="230" fill="#111317" stroke="#3b414a"/><text x="20" y="34" class="s" fill="#f4f2ec">Dark 1x: agent isolation</text><rect x="34" y="62" width="282" height="116" rx="8" fill="#171b22" stroke="#3d4654"/><text x="52" y="94" class="m" fill="#f4f2ec">Jev memory: private</text><text x="52" y="124" class="m" fill="#f4f2ec">Laya memory: not shared</text><text x="52" y="154" class="m" fill="#bfc7d5">Boundary visible before write.</text></g>
  <g transform="translate(816 78)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Light 2x: outage</text><rect x="34" y="64" width="282" height="92" rx="8" fill="#fff4dd" stroke="#c58a24"/><text x="52" y="96" class="m">Historical memory unavailable</text><text x="52" y="126" class="m">Capture, Stop and notes still work</text></g>
  <g transform="translate(228 348)"><rect class="card" width="350" height="230" fill="#111317" stroke="#3b414a"/><text x="20" y="34" class="s" fill="#f4f2ec">Dark 2x: forget confirm</text><rect x="48" y="66" width="254" height="116" rx="8" fill="#21181b" stroke="#cc6670"/><text x="68" y="100" class="m" fill="#ffd9dd">Forget this memory?</text><text x="68" y="132" class="m" fill="#ffd9dd">Scope and effect are explicit.</text></g>
  <g transform="translate(620 348)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Reduced motion</text><rect x="42" y="76" width="266" height="92" rx="8" fill="#f5f6f8" stroke="#c6ccd6"/><text x="60" y="110" class="m">Static status changes.</text><text x="60" y="140" class="m">No recall trail animation.</text></g>
</svg>
