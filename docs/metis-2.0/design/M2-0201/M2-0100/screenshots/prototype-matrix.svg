<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">M2-0100 designed prototype screenshot matrix</title>
  <desc id="desc">Named orbs and compact Agent Home variants.</desc>
  <style>text{font-family:Inter,Arial,sans-serif}.h{font-size:24px;font-weight:700}.s{font-size:15px}.m{font-size:13px}.card{rx:8}.orb{stroke-width:3}</style>
  <rect width="1200" height="760" fill="#f7f5f0"/><text x="32" y="44" class="h" fill="#1c1d20">M2-0100 named orbs and Agent Home</text>
  <g transform="translate(32 78)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Light 1x: compact home</text><rect x="34" y="58" width="282" height="28" rx="6" fill="#f4f6fa" stroke="#c6ccd6"/><circle cx="70" cy="124" r="24" fill="#dce8ff" stroke="#2c4d7a" class="orb"/><text x="104" y="129" class="m">Jev - 2 tasks</text><circle cx="70" cy="169" r="24" fill="#e8f5e8" stroke="#367347" class="orb"/><text x="104" y="174" class="m">Laya - ready</text></g>
  <g transform="translate(424 78)"><rect class="card" width="350" height="230" fill="#111317" stroke="#3b414a"/><text x="20" y="34" class="s" fill="#f4f2ec">Dark 1x: 20 agents</text><g fill="#202734" stroke="#8fb6ff"><circle cx="62" cy="82" r="14"/><circle cx="112" cy="82" r="14"/><circle cx="162" cy="82" r="14"/><circle cx="212" cy="82" r="14"/><circle cx="262" cy="82" r="14"/><circle cx="62" cy="132" r="14"/><circle cx="112" cy="132" r="14"/><circle cx="162" cy="132" r="14"/><circle cx="212" cy="132" r="14"/><circle cx="262" cy="132" r="14"/></g><text x="46" y="190" class="m" fill="#bfc7d5">Stable grid; names show on focus.</text></g>
  <g transform="translate(816 78)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Light 2x: long chat</text><rect x="30" y="60" width="76" height="134" rx="6" fill="#eef2f7"/><rect x="124" y="60" width="190" height="26" rx="6" fill="#f4f6fa"/><rect x="124" y="100" width="160" height="26" rx="6" fill="#f4f6fa"/><rect x="124" y="140" width="182" height="26" rx="6" fill="#f4f6fa"/><text x="42" y="210" class="m">Summary rail prevents full render.</text></g>
  <g transform="translate(228 348)"><rect class="card" width="350" height="230" fill="#111317" stroke="#3b414a"/><text x="20" y="34" class="s" fill="#f4f2ec">Dark 2x: high contrast</text><circle cx="80" cy="115" r="28" fill="#111317" stroke="#f4f2ec" stroke-width="4"/><rect x="134" y="90" width="126" height="20" fill="#f4f2ec"/><text x="134" y="134" class="m" fill="#f4f2ec">Shape + label, not color only.</text></g>
  <g transform="translate(620 348)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Reduced motion</text><circle cx="95" cy="116" r="28" fill="#dce8ff" stroke="#2c4d7a"/><circle cx="175" cy="116" r="28" fill="#f4ead8" stroke="#7a572c"/><circle cx="255" cy="116" r="28" fill="#e8f5e8" stroke="#367347"/><text x="68" y="178" class="m">Static glyphs; no idle loops.</text></g>
</svg>

