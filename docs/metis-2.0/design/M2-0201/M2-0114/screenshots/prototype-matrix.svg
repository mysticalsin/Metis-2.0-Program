<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">M2-0114 designed prototype screenshot matrix</title>
  <desc id="desc">Live meeting quiet assistance, capture truth, recovery, recap and reduced motion.</desc>
  <style>text{font-family:Inter,Arial,sans-serif}.h{font-size:24px;font-weight:700}.s{font-size:15px}.m{font-size:13px}.card{rx:8}</style>
  <rect width="1200" height="760" fill="#f7f5f0"/><text x="32" y="44" class="h" fill="#1c1d20">M2-0114 live meeting surfaces</text>
  <g transform="translate(32 78)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Light 1x: quiet assist</text><rect x="28" y="58" width="294" height="46" rx="8" fill="#eef2f7"/><text x="46" y="87" class="m">Private suggestion, typed reply</text><rect x="28" y="128" width="294" height="54" rx="8" fill="#fff" stroke="#d5dae2"/><text x="46" y="160" class="m">Transcript excludes assistant text.</text></g>
  <g transform="translate(424 78)"><rect class="card" width="350" height="230" fill="#111317" stroke="#3b414a"/><text x="20" y="34" class="s" fill="#f4f2ec">Dark 1x: capture truth</text><rect x="34" y="68" width="282" height="34" rx="17" fill="#2d1d1d" stroke="#e38b8b"/><text x="54" y="91" class="m" fill="#ffdada">System audio missing</text><rect x="34" y="122" width="282" height="34" rx="17" fill="#17221b" stroke="#75c28a"/><text x="54" y="145" class="m" fill="#d6f7de">Microphone recording</text></g>
  <g transform="translate(816 78)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Light 2x: recovery</text><line x1="48" y1="110" x2="302" y2="110" stroke="#b9c0cb" stroke-width="4"/><rect x="142" y="90" width="66" height="40" rx="6" fill="#fff2d6" stroke="#b77c14"/><text x="64" y="164" class="m">Gap marker plus recovery action.</text></g>
  <g transform="translate(228 348)"><rect class="card" width="350" height="230" fill="#111317" stroke="#3b414a"/><text x="20" y="34" class="s" fill="#f4f2ec">Dark 2x: recap now</text><rect x="34" y="64" width="282" height="124" rx="8" fill="#171b22" stroke="#3d4654"/><text x="52" y="94" class="m" fill="#f4f2ec">Decisions: 2</text><text x="52" y="124" class="m" fill="#f4f2ec">Open questions: 3</text><text x="52" y="154" class="m" fill="#bfc7d5">Evidence from current meeting only.</text></g>
  <g transform="translate(620 348)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Reduced motion</text><rect x="44" y="76" width="262" height="90" rx="8" fill="#f5f6f8" stroke="#c6ccd6"/><text x="62" y="110" class="m">Static capture icon.</text><text x="62" y="140" class="m">No pulsing recording animation.</text></g>
</svg>

