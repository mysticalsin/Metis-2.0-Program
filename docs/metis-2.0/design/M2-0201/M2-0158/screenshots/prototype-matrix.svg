<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">M2-0158 designed prototype screenshot matrix</title>
  <desc id="desc">Portal totals, speech readiness, skill runs, knowledge health, partial usage and reduced motion.</desc>
  <style>text{font-family:Inter,Arial,sans-serif}.h{font-size:24px;font-weight:700}.s{font-size:15px}.m{font-size:13px}.card{rx:8}</style>
  <rect width="1200" height="760" fill="#f7f5f0"/><text x="32" y="44" class="h" fill="#1c1d20">M2-0158 portal and data health</text>
  <g transform="translate(32 78)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Light 1x: full-window totals</text><rect x="30" y="64" width="86" height="70" rx="8" fill="#eef2f7"/><rect x="132" y="64" width="86" height="70" rx="8" fill="#eef2f7"/><rect x="234" y="64" width="86" height="70" rx="8" fill="#eef2f7"/><text x="48" y="164" class="m">Totals independent of pagination.</text></g>
  <g transform="translate(424 78)"><rect class="card" width="350" height="230" fill="#111317" stroke="#3b414a"/><text x="20" y="34" class="s" fill="#f4f2ec">Dark 1x: speech readiness</text><rect x="34" y="62" width="282" height="118" rx="8" fill="#171b22" stroke="#3d4654"/><text x="52" y="94" class="m" fill="#f4f2ec">Device: MacBook Pro</text><text x="52" y="124" class="m" fill="#f4f2ec">Privacy revision: 13</text><text x="52" y="154" class="m" fill="#bfc7d5">Local state qualified per device.</text></g>
  <g transform="translate(816 78)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Light 2x: health surfaces</text><rect x="34" y="62" width="282" height="118" rx="8" fill="#f4f6fa" stroke="#c6ccd6"/><text x="52" y="92" class="m">Dust health: degraded</text><text x="52" y="122" class="m">Knowledge freshness: 18 min</text><text x="52" y="152" class="m">Skill runs: receipt-linked</text></g>
  <g transform="translate(228 348)"><rect class="card" width="350" height="230" fill="#111317" stroke="#3b414a"/><text x="20" y="34" class="s" fill="#f4f2ec">Dark 2x: partial usage</text><rect x="48" y="66" width="254" height="116" rx="8" fill="#171b22" stroke="#3d4654"/><text x="68" y="100" class="m" fill="#f4f2ec">Measured: 42 min</text><text x="68" y="130" class="m" fill="#f4f2ec">Estimated: 11 min</text><text x="68" y="160" class="m" fill="#bfc7d5">Unavailable remains separate.</text></g>
  <g transform="translate(620 348)"><rect class="card" width="350" height="230" fill="#fff" stroke="#c8c1b6"/><text x="20" y="34" class="s">Reduced motion</text><rect x="42" y="76" width="266" height="92" rx="8" fill="#f5f6f8" stroke="#c6ccd6"/><text x="60" y="110" class="m">No animated counters.</text><text x="60" y="140" class="m">Map and cards update statically.</text></g>
</svg>
